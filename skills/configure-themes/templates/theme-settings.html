<div class="tsw" id="tsw" data-current="CURRENT">
<style>
.tsw{position:fixed;z-index:999;right:14px;bottom:14px;font:13px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif}
.tsw-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(8,8,8,.82);color:#eee;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.25);backdrop-filter:blur(14px)}
.tsw-btn:hover{background:rgba(24,24,24,.92)}
.tsw-panel{display:none;position:absolute;right:0;bottom:52px;width:min(280px,calc(100vw - 28px));max-height:min(420px,70vh);overflow:auto;padding:10px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(8,8,8,.92);box-shadow:0 12px 40px rgba(0,0,0,.35);backdrop-filter:blur(16px)}
.tsw.open .tsw-panel{display:block}
.tsw-panel p{margin:0 0 8px;padding:4px 8px;color:#9a9a9a;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tsw-panel button{display:block;width:100%;border:0;border-radius:10px;padding:9px 10px;background:transparent;color:#ddd;text-align:left;cursor:pointer}
.tsw-panel button:hover{background:rgba(255,255,255,.08);color:#fff}
.tsw-panel button[aria-current="true"]{background:#f3f0e8;color:#161616}
</style>
<button class="tsw-btn" id="tsw-btn" type="button" aria-label="Settings" aria-expanded="false">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<div class="tsw-panel" id="tsw-panel">
<p>Theme</p>
<div id="tsw-list"></div>
</div>
<script>
(function(){
  var PAGES=__ROSTER__;
  var root=document.getElementById("tsw");
  var cur=root.dataset.current;
  var btn=document.getElementById("tsw-btn");
  var list=document.getElementById("tsw-list");
  try{localStorage.setItem("intranet-theme",cur)}catch(e){}
  PAGES.forEach(function(p){
    var b=document.createElement("button");
    b.type="button";
    b.textContent=p[1];
    if(p[0]===cur)b.setAttribute("aria-current","true");
    b.addEventListener("click",function(){
      try{sessionStorage.setItem("intranet-settings-open","1")}catch(e){}
      location.href=p[0];
    });
    list.appendChild(b);
  });
  function open(){root.classList.add("open");btn.setAttribute("aria-expanded","true")}
  function close(){root.classList.remove("open");btn.setAttribute("aria-expanded","false");try{sessionStorage.removeItem("intranet-settings-open")}catch(e){}}
  btn.addEventListener("click",function(){root.classList.contains("open")?close():open()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
  document.addEventListener("click",function(e){if(!root.contains(e.target))close()});
  try{if(sessionStorage.getItem("intranet-settings-open")==="1")open()}catch(e){}
})();
</script>
</div>
